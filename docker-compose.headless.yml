services:
  t3code-headless:
    image: ghcr.io/misaka-link/t3code-docker:headless
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: headless
    container_name: t3code-headless
    restart: unless-stopped
    init: true
    shm_size: "1gb"
    stop_grace_period: 45s
    pids_limit: 4096
    ports:
      # 单一统一端口（共享 T3 Code 官方 WebUI 与 /admin 控制台；满血研发环境，无虚拟桌面）
      - "${PROXY_PORT:-3080}:${PROXY_PORT:-3080}"
    environment:
      - PROXY_PORT=${PROXY_PORT:-3080}
      - AUTH_TOKEN=${AUTH_TOKEN:-}
      - ADMIN_PATH=${ADMIN_PATH:-/admin}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Asia/Shanghai}
      - TRUST_PROXY=${TRUST_PROXY:-0}
      - PUBLIC_URL=${PUBLIC_URL:-}
      - T3_PREINSTALL=${T3_PREINSTALL:-core}
      - HTTP_PROXY=${HTTP_PROXY:-}
      - HTTPS_PROXY=${HTTPS_PROXY:-}
      - NO_PROXY=${NO_PROXY:-localhost,127.0.0.1,::1}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETUID
      - SETGID
      - KILL
    volumes:
      - ./data/gateway:/data/gateway
      - ./data/t3:/data/t3
      - ./data/providers:/data/providers
      - ./data/home:/home/coder
      - ./data/snapshots:/data/snapshots
      - ./workspace:/workspace
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
