name: CI & Multi-Arch Docker Build

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  verify:
    name: Typecheck, Unit Tests & Bundle Build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test

  docker-build:
    name: Build (${{ matrix.variant }} / ${{ matrix.slug }})
    needs: verify
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: full
            platform: linux/amd64
            runner: ubuntu-24.04
            slug: amd64
          - variant: full
            platform: linux/arm64
            runner: ubuntu-24.04-arm
            slug: arm64
          - variant: headless
            platform: linux/amd64
            runner: ubuntu-24.04
            slug: amd64
          - variant: headless
            platform: linux/arm64
            runner: ubuntu-24.04-arm
            slug: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Normalize image name
        id: meta
        run: |
          IMAGE_LC="$(echo "${IMAGE_NAME}" | tr '[:upper:]' '[:lower:]')"
          echo "image_lc=${IMAGE_LC}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest (push/dispatch)
        if: github.event_name != 'pull_request'
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: ${{ matrix.variant }}
          platforms: ${{ matrix.platform }}
          provenance: false
          sbom: false
          outputs: type=image,name=${{ env.REGISTRY }}/${{ steps.meta.outputs.image_lc }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.variant }}-${{ matrix.slug }}
          cache-to: type=gha,mode=max,scope=${{ matrix.variant }}-${{ matrix.slug }}

      - name: Build check only (pull_request)
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: ${{ matrix.variant }}
          platforms: ${{ matrix.platform }}
          provenance: false
          sbom: false
          push: false
          cache-from: type=gha,scope=${{ matrix.variant }}-${{ matrix.slug }}

      - name: Export digest
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p "${{ runner.temp }}/digests/${{ matrix.variant }}"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${{ matrix.variant }}/${digest#sha256:}"

      - name: Upload digest artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.variant }}-${{ matrix.slug }}
          path: ${{ runner.temp }}/digests/${{ matrix.variant }}/*
          if-no-files-found: error
          retention-days: 1

  docker-merge:
    name: Publish Multi-Arch Manifests
    needs: docker-build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download full digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests/full
          pattern: digests-full-*
          merge-multiple: true

      - name: Download headless digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests/headless
          pattern: digests-headless-*
          merge-multiple: true

      - name: Create and inspect multi-arch manifests
        run: |
          set -eux
          IMAGE_LC="$(echo "${IMAGE_NAME}" | tr '[:upper:]' '[:lower:]')"
          REPO_URI="${REGISTRY}/${IMAGE_LC}"

          FULL_IMAGES=""
          for d in $(ls -1 "${{ runner.temp }}/digests/full"); do
            FULL_IMAGES="${FULL_IMAGES} ${REPO_URI}@sha256:${d}"
          done

          HEADLESS_IMAGES=""
          for d in $(ls -1 "${{ runner.temp }}/digests/headless"); do
            HEADLESS_IMAGES="${HEADLESS_IMAGES} ${REPO_URI}@sha256:${d}"
          done

          # Push headless/slim first and :latest last so GHCR displays :latest at the top of the package page
          docker buildx imagetools create -t "${REPO_URI}:headless" -t "${REPO_URI}:slim" ${HEADLESS_IMAGES}
          docker buildx imagetools create -t "${REPO_URI}:latest" ${FULL_IMAGES}

          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VER="${GITHUB_REF#refs/tags/v}"
            docker buildx imagetools create -t "${REPO_URI}:${VER}-headless" -t "${REPO_URI}:v${VER}-headless" ${HEADLESS_IMAGES}
            docker buildx imagetools create -t "${REPO_URI}:${VER}" -t "${REPO_URI}:v${VER}" ${FULL_IMAGES}
          fi

          docker buildx imagetools inspect "${REPO_URI}:latest"
          docker buildx imagetools inspect "${REPO_URI}:headless"
